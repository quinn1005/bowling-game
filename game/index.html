<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Gutter Kings: a physics bowling roguelike. Hit the target score, buy balls and charms that rewrite the rules.">
<title>Gutter Kings</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="lbl" id="alleyLbl">Lucky Strike Lanes</div>
    <div class="meta">
      <span class="pill groove" id="grooveLbl" title="Groove: PERFECT throws in a row, +1 Mult each. Lasts the whole run until you miss." hidden>♪ 0</span>
      <button class="pill trophy" id="trophyBtn" type="button" title="Trophy shelf" hidden></button>
      <button class="pill rr rrbtn" id="rerackBtn" type="button" title="Re-rack: reset all the pins and take your first roll again"><span id="rrLbl">↻ 2</span></button>
      <span class="pill money" id="money">$4</span>
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
    <div class="round" id="round">Qualifier</div>
    <div class="score" id="score">0</div>
    <div class="bar" id="bar"><i></i></div>
  </header>

  <div class="tally" aria-live="polite">
    <div class="frameinfo"><span class="pill frame" id="frameLbl">Frame 1/5 · Roll 1</span><span class="lbl" id="target" hidden>Target 500</span></div>
    <div class="box chips" id="chipsBox"><small>Points</small><b id="chips">0</b></div>
    <span class="x">×</span>
    <div class="box mult" id="multBox"><small>Mult</small><b id="mult">–</b></div>
    <span class="x">=</span>
    <div class="box eq" id="eqBox"><small>Frame</small><b id="fscore">–</b></div>
  </div>

  <div class="charms" id="charms" role="list" aria-label="Charms"></div>

  <div class="stage" id="stage">
    <div class="lanebox" id="lanebox">
      <canvas id="lane" aria-label="Bowling lane. Tap to stop each moving slider in turn: start spot, angle, power, then hook. The last tap throws. Tap a ball on the ball return to switch balls."></canvas>
      <div class="banner" id="banner" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="coach" id="coach" hidden role="status"><b>Tip</b><p></p><span>Tap to close</span></div>
      <div class="callbar" id="callbar" hidden>
        <div class="lbl">The League Secretary: call your shot</div>
        <div class="row">
          <button class="btn small" type="button" data-call="strike">Strike</button>
          <button class="btn small" type="button" data-call="spare">Spare</button>
          <button class="btn small alt" type="button" data-call="open">Open</button>
        </div>
      </div>
    </div>
    <canvas class="mini" id="mini" aria-label="Lane map: the oil on your lane right now and the line of your last shot"></canvas>
  </div>

  <div class="ctrl" id="ctrl">
    <div class="cmid">
      <span class="stepLbl" id="stepLbl">Tap to stop the start slider</span>
      <span class="shot" id="shot" hidden></span>
      <div class="meter sbar" id="sbar" hidden aria-hidden="true"><i></i><span id="sbarLbl">start</span><b id="sneedle"></b></div>
      <div class="meter pbar" id="pbar" hidden aria-hidden="true"><i id="pzone"></i><span>power</span><b id="pneedle"></b></div>
      <div class="meter hbar" id="hbar" hidden aria-hidden="true"><i></i><span class="hl">← hook</span><span class="hr">hook →</span><b id="hneedle"></b></div>
    </div>
    <button class="cbtn" id="setBtn" type="button">Set start</button>
  </div>

  <div class="dock">
    <div class="rule" id="rule" aria-live="polite"></div>
    <div class="slots" id="cons" role="group" aria-label="Consumables"></div>
    <div class="slots" id="bag" role="group" aria-label="Ball bag" hidden></div>
  </div>

  <div class="card" id="card" aria-label="Scorecard"></div>

  <div class="layer" id="layer" hidden><div class="inner" id="layerInner"></div></div>
  <div class="layer modal" id="modal" hidden><div class="inner" id="modalInner"></div></div>
</div>

<script src="js/version.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/payoffs.js"></script>
<script src="js/physics.js"></script>
<script src="js/scoring.js"></script>
<script src="js/meta.js"></script>
<script src="js/run.js"></script>
<script src="js/frame.js"></script>
<script src="js/surprises.js"></script>
<script src="js/progress.js"></script>
<script src="js/endless.js"></script>
<script src="js/content2.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/fame.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
